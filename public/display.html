<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBHS Student Life — Display</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{
 --void:#0A0418; --ink:#13082E; --purple-mid:#2D1B69; --purple-ui:#3D2680;
 --purple-glow:#5B3FC0; --silver:#C7C9D1; --card:rgba(45,27,105,0.35);
 --line:rgba(255,255,255,0.10); --line-bright:rgba(139,109,255,0.45);
 --muted:rgba(255,255,255,0.55); --faint:rgba(255,255,255,0.3);
 --safe-x: 48px; --safe-y: 36px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
html,body{height:100%;overflow:hidden;cursor:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{background:var(--void);color:#fff;font-family:'DM Sans','Segoe UI',system-ui,sans-serif;}
/* Fixed 1920x1080 design canvas — scaled uniformly to fit whatever screen this
   TV actually has. Every font-size/padding/margin below stays exactly as designed;
   the canvas itself shrinks or grows as one piece, so proportions never break. */
.canvas{position:fixed;top:0;left:0;width:1920px;height:1080px;transform-origin:top left;}

.shade{position:fixed;inset:0;background:linear-gradient(160deg,rgba(10,4,24,0.94),rgba(19,8,46,0.88) 55%,rgba(26,10,61,0.82));}

/* Header */
.hdr{position:fixed;top:var(--safe-y);left:var(--safe-x);right:var(--safe-x);display:flex;align-items:center;justify-content:space-between;padding:28px 48px;z-index:5;}
.hdr-brand{display:flex;align-items:center;gap:16px;font-family:'Arial Narrow','Barlow Condensed',sans-serif;font-size:26px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;}
.hdr-brand img{width:44px;}
.hdr-clock{text-align:right;}
.hdr-time{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;}
.hdr-date{font-size:20px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}

/* Slides */
.stage{position:fixed;inset:var(--safe-y) var(--safe-x);display:flex;align-items:center;justify-content:center;z-index:3;padding:120px 60px 90px;}
.slide{position:absolute;inset:120px 230px 90px 60px;display:flex;flex-direction:column;justify-content:center;opacity:0;transform:translateY(18px);transition:opacity .9s,transform .9s;pointer-events:none;overflow:hidden;}
.slide.on{opacity:1;transform:none;}
.slide-tag{font-family:'Arial Narrow',sans-serif;font-size:20px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#AFA9EC;margin-bottom:28px;display:flex;align-items:center;gap:14px;}
.slide-tag::before{content:'';width:44px;height:3px;background:var(--purple-glow);border-radius:2px;}

/* Events slide */
.ev-row{display:flex;align-items:center;gap:26px;padding:19px 0;border-bottom:1px solid var(--line);}
.ev-date{width:104px;flex-shrink:0;text-align:center;background:linear-gradient(150deg,var(--purple-ui),var(--purple-mid));border-radius:16px;padding:12px 0;border:1px solid var(--line-bright);}
.ev-date.range{width:136px;}
/* Time badge for Today's Games — same size/shape as the date badge it
   replaces, since every row shares today's date and repeating it is noise. */
.ev-time{width:104px;flex-shrink:0;text-align:center;background:linear-gradient(150deg,var(--purple-ui),var(--purple-mid));border-radius:16px;padding:12px 0;border:1px solid var(--line-bright);}
.ev-time .t-hr{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;color:#fff;line-height:1;}
.ev-time .t-ap{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.12em;color:var(--silver);margin-top:2px;}
.ev-date.cross{width:auto;min-width:180px;display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 16px;}
.ev-date.cross .ev-half{display:flex;flex-direction:column;align-items:center;}
.ev-date.cross .ev-mon{font-size:13px;}
.ev-date.cross .ev-day{font-size:30px;}
.ev-date.cross .ev-arrow{color:rgba(255,255,255,0.35);font-size:22px;padding-bottom:4px;}
.ev-mon{font-size:15px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#CDC6F5;}
.ev-day{font-size:38px;font-weight:800;line-height:1.05;}
.ev-t{font-size:33px;font-weight:700;line-height:1.2;overflow:hidden;}
.ev-m{font-size:19px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Announcements slide */
.an-row{padding:22px 0;border-bottom:1px solid var(--line);}
.an-t{font-size:34px;font-weight:700;line-height:1.25;overflow:hidden;}
.an-m{font-size:19px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Class Cup slide */
.cup-row{display:flex;align-items:center;gap:26px;margin-bottom:30px;}
.cup-label{width:230px;flex-shrink:0;font-size:30px;font-weight:700;white-space:nowrap;}
.cup-track{flex:1;height:42px;background:rgba(0,0,0,0.4);border:1px solid var(--line);border-radius:24px;overflow:hidden;}
.cup-fill{height:100%;width:0;border-radius:24px;background:linear-gradient(90deg,#3D2680,#5B3FC0);transition:width 1.4s cubic-bezier(.22,.9,.35,1);}
.cup-row.leader .cup-fill{background:linear-gradient(90deg,#5B3FC0,#8B6DFF);box-shadow:0 0 30px rgba(139,109,255,0.5);}
.cup-pts{width:140px;flex-shrink:0;text-align:right;font-size:30px;font-weight:800;color:var(--silver);font-variant-numeric:tabular-nums;}

/* Countdown / lyric slide */
.cd-wrap{text-align:center;}
.cd-label{font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:24px;}
.cd-num{font-size:150px;font-weight:800;line-height:1;background:linear-gradient(135deg,#F0F0F4,#C7C9D1 50%,#9A9CA8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.cd-days{font-size:26px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:10px;}
.lyric{margin-top:64px;font-size:27px;line-height:1.5;color:var(--silver);font-style:italic;max-width:960px;margin-left:auto;margin-right:auto;}
.lyric em{color:var(--muted);font-style:normal;font-size:21px;display:block;margin-top:12px;}

/* Footer strip */
.ftr{position:fixed;left:var(--safe-x);right:var(--safe-x);bottom:var(--safe-y);padding:26px 52px;display:flex;align-items:center;gap:22px;background:rgba(0,0,0,0.45);border-top:1px solid var(--line);z-index:5;border-radius:14px;}
.ftr-tag{font-family:'Arial Narrow',sans-serif;font-size:22px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#AFA9EC;white-space:nowrap;flex-shrink:0;}
.ftr-marq{flex:1;min-width:0;overflow:hidden;}
.ftr-track{display:inline-flex;align-items:center;white-space:nowrap;font-size:27px;color:var(--silver);will-change:transform;}
@keyframes ftr-crawl{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.ftr-item{padding-right:32px;font-size:27px;line-height:1.3;}
.ftr-sep{color:var(--purple-glow);padding-right:32px;font-size:20px;line-height:1.3;}
.empty{font-size:26px;color:var(--faint);text-align:center;}

/* ── Phone preview mode ── */

   so breakpoint-specific overrides are obsolete and would double-shrink content
   on any device the browser reports as narrow (some TVs included). */

.qr-card{position:fixed;right:calc(44px + var(--safe-x));bottom:calc(96px + var(--safe-y));z-index:6;background:#fff;border-radius:14px;padding:11px 11px 7px;text-align:center;box-shadow:0 10px 34px rgba(0,0,0,0.55);transition:opacity .6s;}
.qr-card canvas,.qr-card img{display:block;border-radius:4px;}
.qr-label{font-family:'Arial Narrow',sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#26215C;margin-top:6px;}

/* ── KOTW slide ── */
.kotw-type{display:inline-block;font-family:'Arial Narrow',sans-serif;font-size:17px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#CDC6F5;background:rgba(91,63,192,0.35);border:1px solid var(--line-bright);padding:7px 20px;border-radius:24px;margin-bottom:22px;}
.kotw-name{font-size:74px;font-weight:800;line-height:1.05;background:linear-gradient(135deg,#F0F0F4,#C7C9D1 50%,#9A9CA8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.kotw-blurb{font-size:29px;color:var(--silver);line-height:1.5;margin-top:22px;max-width:1020px;}
/* ── Poster slide ── */
.poster-wrap{height:100%;display:flex;align-items:center;justify-content:center;}
.poster-wrap img{max-height:100%;max-width:100%;border-radius:16px;box-shadow:0 22px 70px rgba(0,0,0,0.6);}
/* Two flyers side by side in one frame. Falls back to a single centered flyer
   automatically when there's an odd one left over — the flex row just has one child. */

.poster-pair .poster-wrap{flex:1 1 0;min-width:0;height:100%;}

<script>
// Scale the fixed 1920x1080 canvas to fit whatever screen this TV actually has.
// Runs before anything else so the very first paint is already correctly sized.
(function fitCanvas(){
 function apply(){
 const canvas = document.getElementById('canvas');
 if (!canvas) return;
 const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
 const offX = (window.innerWidth - 1920 * scale) / 2;
 const offY = (window.innerHeight - 1080 * scale) / 2;
 canvas.style.transform = 'translate(' + offX + 'px,' + offY + 'px) scale(' + scale + ')';
 }
 window.addEventListener('resize', apply);
 window.addEventListener('orientationchange', apply);
 if (document.readyState === 'loading') {
 document.addEventListener('DOMContentLoaded', apply);
 } else {
 apply();
 }
})();
// Same data sources as the main site
const GIDS = {
 announcements: '1447819289',
 events: '424739582',
 countdown: '1732793405',
 lyric: '185335575',
 spotlight: '888519751',
 flyers: '523531820',
 athletics: '775220800',
};
const MONTHS = {JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11};
const MONTH_ABBR = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

// Sports whose game title never carries a gender prefix on this site.
const ATH_NO_GENDER_PREFIX = ['Football', 'Field Hockey'];

// "Soccer, Junior Varsity, Boys" -> {sport:'Soccer', level:'JV', gender:'Boys'}
function parseAthleticsTeam(teamRaw) {
 const parts = (teamRaw || '').toString().split(',').map(s => s.trim()).filter(Boolean);
 const sport = parts[0] || 'Other';
 let level = 'Varsity';
 if (parts[1]) {
 const lv = parts[1].toLowerCase();
 if (lv.includes('freshman')) level = 'Freshman';
 else if (lv.includes('junior')) level = 'JV';
 }
 return { sport, level, gender: parts[2] || '' };
}
// Accepts ISO (2026-08-17), US slash (8/17/2026), or anything JS's Date()
// natively understands, and returns a clean local-time Date or null.
function parseAthleticsDate(raw) {
 const s = (raw || '').toString().trim();
 if (!s) return null;
 let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
 if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
 m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
 if (m) { let yr = +m[3]; if (yr < 100) yr += 2000; return new Date(yr, +m[1] - 1, +m[2]); }
 const d = new Date(s);
 return isNaN(d.getTime()) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function parseAthleticsTime(raw) {
 const s = (raw || '').toString().trim();
 if (!s) return '';
 if (/^tba$/i.test(s)) return 'TBA';
 let m = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp][Mm])$/);
 if (m) return parseInt(m[1], 10) + ':' + m[2] + ' ' + m[3].toUpperCase();
 m = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
 if (m) {
 const h = parseInt(m[1], 10);
 const ap = h >= 12 ? 'PM' : 'AM';
 let h12 = h % 12; if (h12 === 0) h12 = 12;
 return h12 + ':' + m[2] + ' ' + ap;
 }
 return s;
}
function athleticsSportLabel(sport, gender) {
 if (!gender || ATH_NO_GENDER_PREFIX.includes(sport)) return sport;
 return gender + ' ' + sport;
}
// Turns one raw row from the AD's own sheet (Publish/Date/Time/Team/
// Home-Away/Opponent/Site) into the shape this file renders. Returns
// null for cancelled or unusable rows.
function parseAthleticsRow(r) {
 const publish = (r.Publish || '').toString().trim().toUpperCase();
 const homeAway = (r['Home/Away'] || '').toString().trim();
 if (publish === 'CANCELLED' || homeAway.toUpperCase() === 'CANCELLED') return null;
 const date = parseAthleticsDate(r.Date);
 const opponent = (r.Opponent || '').toString().trim();
 if (!date || !opponent) return null;
 const { sport, level, gender } = parseAthleticsTeam(r.Team);
 const sportLabel = athleticsSportLabel(sport, gender);
 const vsAt = homeAway.toLowerCase() === 'home' ? 'vs' : '@';
 let site = (r.Site || '').toString().trim();
 if (site.includes('>>')) site = site.split('>>')[0].trim();
 return {
 _d: date,
 MONTH: MONTH_ABBR[date.getMonth()],
 DAY: String(date.getDate()),
 TITLE: sportLabel + ' ' + vsAt + ' ' + opponent,
 TIME: parseAthleticsTime(r.Time),
 LOCATION: site,
 _sport: sportLabel,
 _level: level,
 };
}

// Splits a sheet time like "5:30 PM" / "4:00PM" / "TBD" into two badge lines.
// Falls back gracefully rather than showing a broken badge on odd input.
function splitGameTime(raw){
 const s=(raw||'').toString().trim();
 if(!s) return {hr:'TBD', ap:''};
 const m=s.match(/^(\d{1,2}(?::\d{2})?)\s*([APap]\.?[Mm]\.?)?$/);
 if(!m) return {hr:s, ap:''};
 return {hr:m[1], ap:(m[2]||'').replace(/\./g,'').toUpperCase()};
}
function buildEventTile(mon, day, endMonRaw, endDayRaw) {
 endMonRaw = (endMonRaw||'').toString().trim().toUpperCase().slice(0,3);
 endDayRaw = (endDayRaw||'').toString().trim();
 if (endDayRaw && endDayRaw !== '0') {
 const endMon = endMonRaw || mon;
 const endDay = parseInt(endDayRaw) || endDayRaw;
 const sameMonth = endMon === mon;
 const sameDay = String(endDay) === String(day);
 if (!sameDay) {
 if (sameMonth) {
 return '<div class="ev-date range"><div class="ev-mon">'+mon+'</div><div class="ev-day" style="font-size:0.62em;letter-spacing:-0.02em;">'+day+'\u2013'+endDay+'</div></div>';
 }
 return '<div class="ev-date cross">'
 +'<div class="ev-half"><div class="ev-mon">'+mon+'</div><div class="ev-day">'+day+'</div></div>'
 +'<div class="ev-arrow">\u2013</div>'
 +'<div class="ev-half"><div class="ev-mon">'+endMon+'</div><div class="ev-day">'+endDay+'</div></div>'
 +'</div>';
 }
 }
 return '<div class="ev-date"><div class="ev-mon">'+mon+'</div><div class="ev-day">'+day+'</div></div>';
}


// Shrinks a title's font-size until it fits within maxHeight (px), instead of truncating with an ellipsis.
function autosizeTitle(el, maxHeight, minSize){
 if(!el) return;
 let size = parseFloat(getComputedStyle(el).fontSize);
 let guard = 0;
 while(el.scrollHeight > maxHeight && size > minSize && guard < 30){
 size -= 1;
 el.style.fontSize = size + 'px';
 guard++;
 }
 return size;
}
// Applies autosizeTitle to every element matching selector, then sets them ALL to
// whichever ended up smallest — so every row in a list reads at one consistent size
// rather than each row shrinking independently to a different size.
function unifyTitleSizes(selector, maxHeight, minSize, baseSize){
 const els = document.querySelectorAll(selector);
 if(!els.length) return;
 let smallest = baseSize;
 els.forEach(el=>{
 el.style.fontSize = baseSize + 'px';
 const finalSize = autosizeTitle(el, maxHeight, minSize);
 if(finalSize < smallest) smallest = finalSize;
 });
 els.forEach(el=>{ el.style.fontSize = smallest + 'px'; });
}
function splitLine(line){const r=[];let c='',q=false;for(const ch of line){if(ch==='"')q=!q;else if(ch===','&&!q){r.push(c.trim());c='';}else c+=ch;}r.push(c.trim());return r;}
const KNOWN=['TITLE','DATE','SOURCE','TAG','MONTH','DAY','END_MONTH','END_DAY','TIME','LOCATION','LABEL','TARGET_DATE','CLASS','POINTS','LYRIC','SONG','ARTIST'];
function parseCSV(text){
 const lines=text.trim().split('\n');
 if(lines.length<2)return[];
 // Find the real header row — sheets may have instruction rows above it
 let hi=0;
 for(let i=0;i<Math.min(lines.length,8);i++){
 const cells=splitLine(lines[i]).map(c=>c.replace(/^"|"$/g,'').trim().toUpperCase());
 if(cells.some(c=>KNOWN.includes(c))){hi=i;break;}
 }
 const hdrs=splitLine(lines[hi]).map(h=>h.replace(/^"|"$/g,'').trim());
 return lines.slice(hi+1).map(l=>{const v=splitLine(l).map(x=>x.replace(/^"|"$/g,'').trim());const o={};hdrs.forEach((h,i)=>o[h.toUpperCase()]=v[i]||'');return o;}).filter(r=>Object.values(r).some(v=>v));
}
async function tab(gid){
 try{const r=await fetch('/api/sheet?gid='+gid,{cache:'no-store'});if(!r.ok)return[];const t=await r.text();if(!t||t.includes('<!DOCTYPE'))return[];return parseCSV(t);}catch(e){return[];}

async function loadData(){
 const wantFlyers = GIDS.flyers && !GIDS.flyers.includes('_GID');
 const [ann,evt,cd,lyr,kotw,fly,ath]=await Promise.all([tab(GIDS.announcements),tab(GIDS.events),tab(GIDS.countdown),tab(GIDS.lyric),tab(GIDS.spotlight),wantFlyers?tab(GIDS.flyers):Promise.resolve([]),tab(GIDS.athletics)]);

 // Events

 const upcoming=evt.filter(r=>r.TITLE&&!r.TITLE.includes('ADD')&&r.DAY&&r.DAY!=='0'&&/^y/i.test((r.APPROVED||'').trim())).map(r=>{
 const rawDay=(r.DAY||'').toString().trim();
 const dy=rawDay.includes('/')?parseInt(rawDay.split('/')[1]):parseInt(rawDay)||1;
 let mo=(r.MONTH||'').toString().trim().toUpperCase().slice(0,3);
 if(mo in MONTHS){
 let yr=today.getFullYear();
 let d=new Date(yr,MONTHS[mo],dy);
 if(d<new Date(today.getTime()-86400000))d=new Date(yr+1,MONTHS[mo],dy);
 r._d=d;r._mon=mo;r._day=dy;
 } else r._d=new Date(9999,0,1);
 return r;
 }).filter(r=>r._d>=today).sort((a,b)=>a._d-b._d).slice(0,5);
 document.getElementById('ev-list').innerHTML=upcoming.length?upcoming.map(r=>
 '<div class="ev-row">'+buildEventTile(r._mon,r._day,r.END_MONTH,r.END_DAY)+
 '<div><div class="ev-t">'+r.TITLE+'</div><div class="ev-m">'+(r.TIME||'All Day')+(r.LOCATION?' · '+r.LOCATION:'')+'</div></div></div>'
 ).join(''):'<div class="empty">No upcoming events posted.</div>';
 unifyTitleSizes('#ev-list .ev-t', 79, 18, 33);

 // Today's Games — same athletics tab the website uses.
 // Announcements are NOT rendered as a slide anymore; they still feed the
 // footer ticker below, so the same info isn't shown twice on screen.
 (function(){
 const today=new Date(); today.setHours(0,0,0,0);
 const tomorrow=new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
 const games=(ath||[]).map(parseAthleticsRow).filter(Boolean)
 // Today only — no cap, so every game on the day is listed.
 .filter(r=>r._d>=today&&r._d<tomorrow&&r._level==='Varsity').sort((a,b)=>a._d-b._d);
 document.getElementById('game-list').innerHTML=games.length?games.map(g=>{
 const t=splitGameTime(g.TIME);
 return '<div class="ev-row">'
 + '<div class="ev-time"><div class="t-hr">'+t.hr+'</div>'+(t.ap?'<div class="t-ap">'+t.ap+'</div>':'')+'</div>'
 + '<div><div class="ev-t">'+g.TITLE+'</div>'
 + (g.LOCATION?'<div class="ev-m">'+g.LOCATION+'</div>':'')
 + '</div></div>';
 }).join(''):'<div class="empty">No games scheduled today.</div>';
 unifyTitleSizes('#game-list .ev-t', 84, 18, 34);
 })();
 // Footer ticker: continuous crawl of all announcements
 const tickerAnn = ann.filter(a=>a.TITLE&&!a.TITLE.includes('ADD YOUR')).slice(0,8);

 if (track) {
 const items = tickerAnn.length
 ? tickerAnn.map(a=>a.TITLE+(a.DATE?' — '+a.DATE:''))
 : ['Welcome to OBHS Student Life'];
 const half = items.map(t=>'<span class="ftr-item">'+t+'</span><span class="ftr-sep">✦</span>').join('');
 track.style.animation = 'none';
 track.innerHTML = half + half;
 requestAnimationFrame(()=>{
 requestAnimationFrame(()=>{
 const w = track.scrollWidth / 2;

 track.style.animation = 'ftr-crawl ' + dur + 's linear infinite';
 });
 });
 }

 // Knight of the Week

 document.getElementById('kotw-wrap').innerHTML=
 '<div class="kotw-type">'+icon+' '+type+'</div>'+

 ((k.BLURB||k.DESCRIPTION)?'<div class="kotw-blurb">'+(k.BLURB||k.DESCRIPTION)+'</div>':'');

 } else {

 }

 // Club flyers — pair them up two per slide, side by side. A trailing odd

 document.querySelectorAll('.flyer-slide').forEach(el=>el.remove());
 flyerIds=[];
 const flyClean=fly.filter(r=>{

 }).slice(0,8);
 const stage=document.querySelector('.stage');
 for(let i=0;i<flyClean.length;i+=2){

 d.className='slide full-art flyer-slide';
 d.id='slide-flyer-'+(i/2);

 d.innerHTML='<div class="poster-pair">'+imgs+'</div>';

 }

 rebuildSlides();

 // Countdown
 const cdRow=cd.find(r=>r.TARGET_DATE);
 if(cdRow){
 document.getElementById('cd-label').textContent=cdRow.LABEL||'Countdown';
 const t=new Date(cdRow.TARGET_DATE);
 const days=Math.max(0,Math.ceil((t-new Date())/86400000));
 document.getElementById('cd-num').textContent=days;
 }

 // Lyric
 const lyrRows=lyr.filter(r=>(r.LYRIC||'').trim());
 if(lyrRows.length){
 const r=lyrRows[lyrRows.length-1];
 const attribution=[r.SONG,r.ARTIST].filter(Boolean).join(', ');
 document.getElementById('lyric').innerHTML='\u201C'+r.LYRIC+'\u201D'+(attribution?'<em>— '+attribution+(r['SUBMITTED BY']?' · submitted by '+r['SUBMITTED BY']:'')+'</em>':'');
 document.getElementById('lyric').style.display='block';
 }
}
loadData();
setInterval(loadData,5*60*1000); // refresh data every 5 minutes
setTimeout(()=>location.reload(),30*60*1000); // full reload every 30 min (picks up code updates)
